<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <!-- Cyan to Deep Ocean Gradient -->
    <linearGradient id="spillGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00A8E8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Group -->
  <g transform="translate(10, 10)">
    <!-- Water Drop Outer Outline -->
    <path 
      d="M 65 15 C 65 15, 25 70, 25 95 C 25 120, 45 135, 65 135 C 85 135, 105 120, 105 95 C 105 70, 65 15, 65 15 Z" 
      fill="none" 
      stroke="url(#spillGradient)" 
      stroke-width="5" 
      stroke-linejoin="round"
      filter="url(#cyanGlow)"
    />

    <!-- Orbital Swirl Loop -->
    <path 
      d="M 20 60 C 40 40, 85 30, 110 55 C 120 65, 115 85, 95 95 C 75 105, 45 110, 35 125" 
      fill="none" 
      stroke="#00F0FF" 
      stroke-width="3.5" 
      stroke-linecap="round"
      opacity="0.9"
    />

    <!-- Ship Silhouette Inside Drop -->
    <path 
      d="M 40 108 L 90 108 L 82 120 L 48 120 Z" 
      fill="url(#spillGradient)" 
    />
    <rect x="58" y="98" width="14" height="10" fill="#00F0FF" rx="1" />
    <rect x="62" y="92" width="6" height="6" fill="#00F0FF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(145, 95)">
    <text 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-weight="700" 
      font-size="44" 
      fill="#FFFFFF" 
      letter-spacing="-0.5"
    >
      SpillTrace <tspan fill="#00F0FF">AI</tspan>
    </text>
  </g>
</svg>
